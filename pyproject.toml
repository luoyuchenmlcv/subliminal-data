[project]
name = "subliminal-data"
version = "0.1.0"
description = "Figure-level steering-vector and Fisher-spectrum reproduction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.9.0",
    "matplotlib>=3.10.3",
    "numpy==1.26.1",
    "torch>=2.7.1",
    "transformers==4.54.0",
    "tqdm>=4.67.1",
    "wandb>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["steering_recovery*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]
